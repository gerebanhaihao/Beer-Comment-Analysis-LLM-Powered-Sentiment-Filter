[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "beer-sentiment"
version = "0.1.0"
description = "啤酒行业负面舆情双阶段筛选管线：规则粗筛 + LLM 语义判定 + Benchmark 评测"
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
dependencies = [
    "openpyxl>=3.1",
    "PyYAML>=6.0",
]

[project.optional-dependencies]
llm = ["openai>=1.30"]
dev = ["pytest>=8.0", "ruff>=0.5"]

[project.scripts]
beer-sentiment = "beer_sentiment.cli:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py310"
