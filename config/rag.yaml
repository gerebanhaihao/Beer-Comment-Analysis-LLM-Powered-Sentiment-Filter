# Hybrid RAG 配置：知识库检索 -> 注入 Stage 2 判定 Prompt
enabled: true

knowledge_base: "config/knowledge_base.yaml"

sparse: # BM25 稀疏召回
  top_k: 10
  k1: 1.5
  b: 0.75

dense: # SentenceTransformer 语义向量召回
  top_k: 10
  model: BAAI/bge-small-zh-v1.5

rrf: # 倒数排名融合
  k: 60

rerank: # 独立 CrossEncoder 模型重排序，推理失败回退 RRF 顺序
  enabled: false
  top_n: 8
  model: BAAI/bge-reranker-base

fewshot: # 最终注入 Prompt 的条数与长度上限
  top_k: 5
  max_context_chars: 1500
